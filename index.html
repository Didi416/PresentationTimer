<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="description">
            <h1>Presentation Timer</h1>
            <p>Welcome to your Intro to Mechatronics Engineering project showcase! I'm excited to see your project! This timer is just here to give a clear visual on the time left for your demo. Good luck!</p>
        </div>

        <div class="time-section">
            <div class="time-label">Current Time</div>
            <div class="current-time" id="currentTime">00:00</div>
        </div>

        <div class="countdown-section">
            <div class="countdown-label">Time Left in Demo (total 20 mins)</div>
            <div class="countdown" id="countdown">20:00</div>
        </div>

        <div class="controls">
            <button onclick="startCountdown()">Start Timer</button>
            <button onclick="resetCountdown()">Reset</button>
            <button onclick="pauseCountdown()">Pause/Resume</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        let countdownInterval;
        let timeRemaining = 20*60; // 10 minutes in seconds
        let isPaused = false;
        let endTime = null;

        function updateCurrentTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('currentTime').textContent = `${hours}:${minutes}`;
        }

        function updateCountdown() {
            if (!isPaused && timeRemaining > 0) {
                timeRemaining--;
                displayCountdown();

                if (timeRemaining === 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('status').textContent = '🔔 Time to start!';
                    playNotification();
                }
            }
        }

        function displayCountdown() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            document.getElementById('countdown').textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function startCountdown() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            if (timeRemaining === 0) {
                timeRemaining = 20*60;
            }
            
            isPaused = false;
            endTime = new Date(Date.now() + timeRemaining * 1000);
            document.getElementById('status').textContent = 'Timer running...';
            
            countdownInterval = setInterval(updateCountdown, 1000);
        }

        function resetCountdown() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            timeRemaining = 20*60;
            isPaused = false;
            displayCountdown();
            document.getElementById('status').textContent = '';
        }

        function pauseCountdown() {
            isPaused = !isPaused;
            document.getElementById('status').textContent = isPaused ? 'Timer paused' : 'Timer running...';
        }

        function playNotification() {
            // Visual notification only (no audio API needed)
            const countdown = document.getElementById('countdown');
            countdown.style.color = '#cc5500';
            setTimeout(() => {
                countdown.style.color = '#ffffff';
            }, 500);
        }

        // Update current time every second
        setInterval(updateCurrentTime, 1000);
        updateCurrentTime();
        displayCountdown();
    </script>
</body>
</html>
